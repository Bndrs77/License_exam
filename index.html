<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بنك أسئلة الرخصة المهنية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: sticky top bar, one centered column; home = category grid + mode tabs; quiz = single question card with progress rail */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#10222b; --muted:#566b72; --line:#d6e0de;
  --accent:#0b7a5a; --accent-ink:#ffffff; --accent-soft:#dff2ea;
  --good:#12805c; --good-soft:#dcf3e8; --bad:#b3261e; --bad-soft:#fbe3e0; --warn:#a86300; --warn-soft:#fbefd5;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --font-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1a1f; --surface:#14262d; --ink:#e6f0ee; --muted:#9bb2b7; --line:#264049;
  --accent:#3fc59a; --accent-ink:#06231a; --accent-soft:#12372f;
  --good:#4ad39f; --good-soft:#12372f; --bad:#ff8a80; --bad-soft:#41201f; --warn:#f2b45a; --warn-soft:#3b2d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a1f; --surface:#14262d; --ink:#e6f0ee; --muted:#9bb2b7; --line:#264049;
  --accent:#3fc59a; --accent-ink:#06231a; --accent-soft:#12372f;
  --good:#4ad39f; --good-soft:#12372f; --bad:#ff8a80; --bad-soft:#41201f; --warn:#f2b45a; --warn-soft:#3b2d12; color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
code{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate;background:var(--accent-soft);padding:0 .35em;border-radius:4px;font-size:.88em;display:inline-block;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding-inline:max(16px,env(safe-area-inset-left,0px));}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.05rem;border:0;background:none;padding:0;text-align:start;flex:1;min-width:0}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:.78rem;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:.88rem}
h1,h2,h3{font-family:var(--font-display);line-height:1.5;text-wrap:balance;margin:0}
.hero{padding-block:28px 12px}
.hero h1{font-size:clamp(1.5rem,5vw,2.1rem)}
.hero p{color:var(--muted);margin:8px 0 0;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font-size:.92rem}
.stats b{font-family:var(--font-display);font-size:1.2rem;color:var(--accent);font-variant-numeric:tabular-nums}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-block:20px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode:hover{border-color:var(--accent)}
.mode strong{font-family:var(--font-display);font-size:1rem}
.mode span{color:var(--muted);font-size:.86rem}
.mode.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode.primary span{color:inherit;opacity:.85}
h2.sec{font-size:1.1rem;margin-block:28px 12px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:start;display:grid;gap:6px;min-width:0}
.cat:hover{border-color:var(--accent)}
.cat .t{font-weight:600;line-height:1.5}
.cat .m{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 14px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-top:20px;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.timer{font-family:var(--font-mono);font-weight:700;color:var(--ink);direction:ltr}
.timer.low{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:14px}
.qcat{font-size:.8rem;color:var(--accent);font-weight:600;letter-spacing:.02em}
.qtext{font-size:1.15rem;font-weight:500;margin:6px 0 16px;line-height:1.75}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.82rem;font-weight:600;color:var(--muted)}
.opt .v{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--accent-ink);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.note{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);font-size:.93rem}
.verdict{margin-top:14px;font-weight:600}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:14px}
.grid button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 0;font-size:.82rem;font-variant-numeric:tabular-nums}
.grid button.done{background:var(--accent-soft);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--ink)}
.score{font-family:var(--font-display);font-size:2.6rem;color:var(--accent);line-height:1.2;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:420px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start}
td.n{font-variant-numeric:tabular-nums}
input[type=search],select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
input[type=search]{flex:1 1 220px}
.bitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:10px}
.bitem .q{font-weight:500}
.bitem .a{margin-top:6px;color:var(--good);font-weight:600}
.bitem .w{color:var(--muted);font-size:.9rem;margin-top:2px}
.empty{padding:28px;text-align:center;color:var(--muted)}
footer{margin-top:40px;color:var(--muted);font-size:.84rem}
.credit{margin-top:32px;text-align:center;direction:ltr;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" id="homeBtn" type="button">بنك أسئلة الرخصة المهنية للحاسب الآلي<small>الحاسب الآلي والتربوي العام</small></button>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="تبديل المظهر">المظهر</button>
</div></header>
<main class="wrap" id="app"><noscript><p style="padding:40px 0;text-align:center">فعّل JavaScript في المتصفح لعرض بنك الأسئلة.</p></noscript></main>
<div class="wrap"><div class="credit">Made by Bandar Alshehri</div></div>

  </section>
  <div class="modes">
    <button class="mode primary" id="mExam" type="button"><strong>اختبار تجريبي</strong><span>أسئلة عشوائية بوقت محدد، والنتيجة في النهاية</span></button>
    <button class="mode" id="mAll" type="button"><strong>تدريب عشوائي</strong><span>من كل المحاور مع تصحيح بعد كل سؤال</span></button>
    <button class="mode" id="mRev" type="button"><strong>مراجعة أخطائي</strong><span>${wrongN} سؤال أخطأت فيه سابقًا</span></button>
    <button class="mode" id="mBrowse" type="button"><strong>تصفح بنك الأسئلة</strong><span>بحث وعرض الإجابات الصحيحة</span></button>
  </div>
  <h2 class="sec">التدريب حسب المحور</h2>
  <div class="cats">${catIdx().map(i=>{const c=CATS[i];
    const qs=BANK.filter(q=>q.cat===i),s=qs.filter(q=>q.id in stats.seen).length;
    return `<button class="cat" data-c="${i}" type="button"><span class="t">${c}</span>
      <span class="bar"><i style="width:${Math.round(s/qs.length*100)}%"></i></span>
      <span class="m"><span>${qs.length} سؤال</span><span>أجبت عن ${s}</span></span></button>`}).join("")}</div>
  <div id="setup"></div>
  <footer>بنك تدريبي مساعد للمراجعة، وليس نسخة من الاختبار الرسمي.</footer>`;
  $("#bk").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;bank=b.dataset.b;try{localStorage.setItem("rq-bank",bank)}catch(x){}viewHome()};
  $("#mExam").onclick=examSetup;
  $("#mAll").onclick=()=>practiceSetup(null);
  $("#mRev").onclick=()=>{
    const qs=P.filter(q=>stats.wrong.includes(q.id));
    if(!qs.length){$("#setup").innerHTML=`<div class="panel empty">لا توجد أسئلة للمراجعة بعد. ستظهر هنا الأسئلة التي تخطئ فيها.</div>`;return}
    runPractice(qs,"مراجعة الأخطاء")};
  $("#mBrowse").onclick=()=>{location.hash="browse"};
  document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>practiceSetup(+b.dataset.c));
}
function scrollSetup(){const e=$("#setup");if(e)e.scrollIntoView({behavior:"smooth",block:"center"})}

/* PRACTICE */
function practiceSetup(c){
  const pool=c===null?POOL():BANK.filter(q=>q.cat===c);
  const name=c===null?"كل المحاور":CATS[c];
  const counts=[10,20,50,pool.length].filter((n,i,a)=>n<=pool.length&&a.indexOf(n)===i);
  let n=counts[0];
  $("#setup").innerHTML=`<div class="panel"><h3>${name}</h3>
    <p style="color:var(--muted);margin:6px 0 14px">اختر عدد الأسئلة. يظهر الصواب والخطأ بعد كل إجابة.</p>
    <div class="chips" id="cnt">${counts.map((x,i)=>`<button class="chip" type="button" data-n="${x}" aria-pressed="${i===0}">${x===pool.length&&x>50?"الكل ("+x+")":x}</button>`).join("")}</div>
    <div class="row" style="margin-top:16px"><button class="btn" id="go" type="button">ابدأ التدريب</button></div></div>`;
  $("#cnt").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;n=+b.dataset.n;
    document.querySelectorAll("#cnt .chip").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("#go").onclick=()=>runPractice(shuf(pool).slice(0,n),name);
  scrollSetup();
}
function runPractice(qs,title){
  const list=qs.map(prep);let i=0,right=0,answered=false;
  const wrongThis=[];
  function show(){
    answered=false;const q=list[i];
    app.innerHTML=`
    <div class="qhead"><span>${title}</span><span>السؤال ${i+1} من ${list.length}</span></div>
    <div class="prog"><i style="width:${i/list.length*100}%"></i></div>
    <div class="qcard"><div class="qcat">${CATS[q.cat]}</div>
      <div class="qtext">${fmt(q.q)}</div>
      <div class="opts" id="opts">${q.opts.map((o,k)=>`<button class="opt" type="button" data-k="${k}"><span class="k">${LAT[k]}</span><span class="v">${fmt(o.t)}</span></button>`).join("")}</div>
      <div id="fb"></div></div>
    <div class="nav"><button class="btn ghost" id="quit" type="button">إنهاء</button><button class="btn" id="next" type="button" disabled>${i===list.length-1?"عرض النتيجة":"السؤال التالي"}</button></div>`;
    $("#quit").onclick=()=>{if(i>0)finish();else location.hash="home",viewHome()};
    $("#next").onclick=()=>{i++;i<list.length?(show(),window.scrollTo(0,0)):finish()};
    $("#opts").onclick=e=>{
      const b=e.target.closest(".opt");if(!b||answered)return;answered=true;
      const k=+b.dataset.k,ok=q.opts[k].ok;
      document.querySelectorAll(".opt").forEach((el,idx)=>{el.disabled=true;if(q.opts[idx].ok)el.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      right+=ok;stats.seen[q.id]=ok;
      if(ok)stats.wrong=stats.wrong.filter(x=>x!==q.id);else{wrongThis.push(q);if(!stats.wrong.includes(q.id))stats.wrong.push(q.id)}
      save();
      $("#fb").innerHTML=`<div class="verdict ${ok?"ok":"no"}">${ok?"إجابة صحيحة":"إجابة غير صحيحة"}</div>`+(q.expl?`<div class="note">${fmt(q.expl)}</div>`:"");
      $("#next").disabled=false;$("#next").focus();
    };
  }
  function finish(){
    const done=i+(answered?1:0);
    app.innerHTML=`<div class="panel"><div class="qcat">انتهى التدريب</div>
      <div class="score">${right} / ${done}</div>
      <p style="color:var(--muted);margin:4px 0 16px">${done?Math.round(right/done*100):0}% إجابات صحيحة</p>
      <div class="row"><button class="btn" id="again" type="button">تدريب جديد</button>
      ${wrongThis.length?`<button class="btn ghost" id="redo" type="button">أعد الأسئلة التي أخطأت فيها (${wrongThis.length})</button>`:""}</div></div>`;
    $("#again").onclick=()=>{location.hash="home";viewHome()};
    if(wrongThis.length)$("#redo").onclick=()=>runPractice(wrongThis,"إعادة الأخطاء");
    window.scrollTo(0,0);
  }
  show();window.scrollTo(0,0);
}

/* EXAM */
let timerId=0;
function examSetup(){
  const opts=[[30,36],[60,72],[100,120]];let sel=1;
  $("#setup").innerHTML=`<div class="panel"><h3>الاختبار التجريبي</h3>
    <p style="color:var(--muted);margin:6px 0 14px">أسئلة عشوائية من جميع المحاور. يمكنك التنقل بين الأسئلة وتغيير إجاباتك، وتظهر النتيجة بعد التسليم.</p>
    <div class="chips" id="ex">${opts.map((o,i)=>`<button class="chip" type="button" data-i="${i}" aria-pressed="${i===1}">${o[0]} سؤالًا، ${o[1]} دقيقة</button>`).join("")}</div>
    <div class="row" style="margin-top:16px"><button class="btn" id="go" type="button">ابدأ الاختبار</button></div></div>`;
  $("#ex").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;sel=+b.dataset.i;
    document.querySelectorAll("#ex .chip").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("#go").onclick=()=>runExam(opts[sel][0],opts[sel][1]);
  scrollSetup();
}
function runExam(n,mins){
  /* balanced draw: proportional share from each category */
  const P=POOL();
  const byCat=catIdx().map(c=>shuf(P.filter(q=>q.cat===c)));
  let picked=[];
  byCat.forEach(a=>picked.push(...a.slice(0,Math.round(n*a.length/P.length))));
  const rest=shuf(P.filter(q=>!picked.includes(q)));
  while(picked.length<n)picked.push(rest.pop());
  picked=shuf(picked).slice(0,n);
  const list=picked.map(prep),ans=new Array(n).fill(-1);
  let i=0,left=mins*60;
  function tick(){
    left--;const t=$("#tm");
    if(t){t.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");t.classList.toggle("low",left<=300)}
    if(left<=0){clearInterval(timerId);submit()}
  }
  function show(){
    const q=list[i],doneN=ans.filter(a=>a>=0).length;
    app.innerHTML=`
    <div class="qhead"><span>اختبار تجريبي، أجبت عن ${doneN} من ${n}</span><span class="timer" id="tm">${String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")}</span></div>
    <div class="prog"><i style="width:${doneN/n*100}%"></i></div>
    <div class="qcard"><div class="qcat">السؤال ${i+1} من ${n}</div>
      <div class="qtext">${fmt(q.q)}</div>
      <div class="opts" id="opts">${q.opts.map((o,k)=>`<button class="opt ${ans[i]===k?"sel":""}" type="button" data-k="${k}"><span class="k">${LAT[k]}</span><span class="v">${fmt(o.t)}</span></button>`).join("")}</div></div>
    <div class="nav"><button class="btn ghost" id="prev" type="button" ${i===0?"disabled":""}>السابق</button>
      ${i===n-1?`<button class="btn" id="sub" type="button">تسليم الاختبار</button>`:`<button class="btn" id="nx" type="button">التالي</button>`}</div>
    <div class="grid" id="gr">${list.map((_,k)=>`<button type="button" data-g="${k}" class="${ans[k]>=0?"done":""} ${k===i?"cur":""}" aria-label="السؤال ${k+1}">${k+1}</button>`).join("")}</div>
    ${i<n-1&&doneN===n?`<div class="row" style="margin-top:14px"><button class="btn" id="sub2" type="button">تسليم الاختبار</button></div>`:""}`;
    $("#opts").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;ans[i]=+b.dataset.k;show()};
    const pv=$("#prev");if(pv)pv.onclick=()=>{i--;show()};
    const nx=$("#nx");if(nx)nx.onclick=()=>{i++;show();window.scrollTo(0,0)};
    ["#sub","#sub2"].forEach(s=>{const b=$(s);if(b)b.onclick=confirmSubmit});
    $("#gr").onclick=e=>{const b=e.target.closest("button");if(!b)return;i=+b.dataset.g;show();window.scrollTo(0,0)};
  }
  function confirmSubmit(){
    const un=ans.filter(a=>a<0).length;
    if(!un)return submit();
    const nav=document.querySelector(".nav");
    nav.insertAdjacentHTML("afterend",`<div class="note" id="cf">يوجد ${un} سؤال بلا إجابة. هل تريد التسليم الآن؟
      <div class="row" style="margin-top:8px"><button class="btn" id="yes" type="button">نعم، سلّم</button><button class="btn ghost" id="no" type="button">متابعة الاختبار</button></div></div>`);
    $("#yes").onclick=submit;$("#no").onclick=()=>$("#cf").remove();
  }
  function submit(){
    clearInterval(timerId);
    let right=0;const per=CATS.map(()=>[0,0]),wr=[];
    list.forEach((q,k)=>{
      const ok=ans[k]>=0&&q.opts[ans[k]].ok?1:0;right+=ok;per[q.cat][1]++;per[q.cat][0]+=ok;
      stats.seen[q.id]=ok;
      if(ok)stats.wrong=stats.wrong.filter(x=>x!==q.id);else{wr.push(k);if(!stats.wrong.includes(q.id))stats.wrong.push(q.id)}
    });
    stats.exams.push({n,right,t:Date.now()});stats.exams=stats.exams.slice(-20);save();
    const pct=Math.round(right/n*100),used=mins*60-left;
    app.innerHTML=`<div class="panel"><div class="qcat">نتيجة الاختبار التجريبي</div>
      <div class="score">${right} / ${n}</div>
      <p style="color:var(--muted);margin:4px 0 0">${pct}% · الزمن المستغرق ${Math.floor(used/60)} د ${used%60} ث</p>
      <div class="tbl"><table><thead><tr><th>المحور</th><th>الصحيح</th><th>النسبة</th></tr></thead><tbody>
      ${per.map((p,c)=>p[1]?`<tr><td>${CATS[c]}</td><td class="n">${p[0]} / ${p[1]}</td><td class="n">${Math.round(p[0]/p[1]*100)}%</td></tr>`:"").join("")}
      </tbody></table></div>
      <div class="row" style="margin-top:16px"><button class="btn" id="again" type="button">اختبار جديد</button><button class="btn ghost" id="home" type="button">الرئيسية</button></div></div>
      <h2 class="sec">مراجعة الإجابات (${wr.length} خطأ)</h2>
      <div id="rv">${wr.length?wr.map(k=>{const q=list[k],mine=ans[k]>=0?q.opts[ans[k]].t:null;
        return `<div class="bitem"><div class="q">${fmt(q.q)}</div>
        <div class="a">الصواب: ${fmt(q.right)}</div>
        <div class="w">${mine?"إجابتك: "+fmt(mine):"لم تجب عن هذا السؤال"}</div>
        ${q.expl?`<div class="note">${fmt(q.expl)}</div>`:""}</div>`}).join(""):`<div class="panel empty">أجبت عن جميع الأسئلة إجابة صحيحة.</div>`}</div>`;
    $("#again").onclick=()=>{location.hash="home";viewHome();examSetup()};
    $("#home").onclick=()=>{location.hash="home";viewHome()};
    window.scrollTo(0,0);
  }
  show();window.scrollTo(0,0);
  clearInterval(timerId);timerId=setInterval(tick,1000);
}

/* BROWSE */
function viewBrowse(){
  let cat="all",term="",shown=40;
  app.innerHTML=`<section class="hero"><h1>تصفح بنك الأسئلة</h1><p>الإجابة الصحيحة تظهر بعد كل سؤال. ابحث بكلمة أو اختر محورًا.</p></section>
    <div class="row"><input type="search" id="q" placeholder="ابحث في الأسئلة والإجابات" aria-label="بحث">
    <select id="c" aria-label="المحور"><option value="all">كل المحاور</option>${CATS.map((c,i)=>`<option value="${i}">${c}</option>`).join("")}</select></div>
    <p id="cnt" style="color:var(--muted);font-size:.9rem"></p><div id="list"></div><div class="row" style="justify-content:center;margin-top:16px" id="more"></div>`;
  const norm=s=>s.replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase();
  function draw(){
    const t=norm(term.trim());
    const res=BANK.filter(q=>(cat==="all"||q.cat===+cat)&&(!t||norm([q.q,q.right,...q.wrong].join(" ")).includes(t)));
    $("#cnt").textContent=res.length+" سؤال";
    $("#list").innerHTML=res.slice(0,shown).map(q=>`<div class="bitem"><div class="qcat">${CATS[q.cat]}</div><div class="q">${fmt(q.q)}</div>
      <div class="a">الصواب: ${fmt(q.right)}</div><div class="w">الخيارات الأخرى: ${q.wrong.map(fmt).join("، ")}</div>
      ${q.expl?`<div class="note">${fmt(q.expl)}</div>`:""}</div>`).join("")||`<div class="panel empty">لا توجد نتائج مطابقة.</div>`;
    $("#more").innerHTML=res.length>shown?`<button class="btn ghost" id="mb" type="button">عرض المزيد (${res.length-shown})</button>`:"";
    const mb=$("#mb");if(mb)mb.onclick=()=>{shown+=40;draw()};
  }
  $("#q").oninput=e=>{term=e.target.value;shown=40;draw()};
  $("#c").onchange=e=>{cat=e.target.value;shown=40;draw()};
  draw();
}
route();
</script>
